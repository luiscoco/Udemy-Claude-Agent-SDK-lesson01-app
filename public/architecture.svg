<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1530" viewBox="0 0 1640 1530"><title>Install, configure, run: Agent SDK file discovery</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1640" height="1530" fill="white"/><text x="40" y="52" font-size="32" font-family="Arial" font-weight="bold" fill="#101a44">What files are here? · one query with a real Glob call</text><rect x="15" y="90" width="290" height="80" rx="16" fill="#087fff"/><text x="160" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Student</text><path d="M160 170 V1480" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="345" y="90" width="290" height="80" rx="16" fill="#8838ff"/><text x="490" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Browser + host</text><path d="M490 170 V1480" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="675" y="90" width="290" height="80" rx="16" fill="#8838ff"/><text x="820" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Agent SDK</text><path d="M820 170 V1480" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1005" y="90" width="290" height="80" rx="16" fill="#00a977"/><text x="1150" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Claude API</text><path d="M1150 170 V1480" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1335" y="90" width="290" height="80" rx="16" fill="#087fff"/><text x="1480" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Demo folder</text><path d="M1480 170 V1480" stroke="#aec6df" stroke-dasharray="8 7"/><text x="170" y="232" fill="#142d53" font-family="Arial" font-size="26">1. Ask: What files are here?</text><path d="M160 250 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="337" fill="#142d53" font-family="Arial" font-size="26">2. Check inherited key and input</text><path d="M490 355 h55 v22 h-55" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="442" fill="#142d53" font-family="Arial" font-size="26">3. query(prompt, options); cwd set</text><path d="M490 460 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="547" fill="#142d53" font-family="Arial" font-size="26">4. Send prompt and Glob tool definition</text><path d="M820 565 H1150" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="652" fill="#142d53" font-family="Arial" font-size="26">5. Request Glob file discovery</text><path d="M1150 670 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="757" fill="#142d53" font-family="Arial" font-size="26">6. Run Glob in sample-workspace</text><path d="M820 775 H1480" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="862" fill="#142d53" font-family="Arial" font-size="26">7. Return matching file paths</text><path d="M1480 880 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="967" fill="#142d53" font-family="Arial" font-size="26">8. Send the tool result to Claude</text><path d="M820 985 H1150" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="1072" fill="#142d53" font-family="Arial" font-size="26">9. Produce the final answer</text><path d="M1150 1090 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="1177" fill="#142d53" font-family="Arial" font-size="26">10. Yield tool, text and result messages</text><path d="M820 1195 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="1282" fill="#142d53" font-family="Arial" font-size="26">11. Print results or render safe text</text><path d="M490 1300 h55 v22 h-55" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="170" y="1387" fill="#142d53" font-family="Arial" font-size="26">12. Compare files; check final status</text><path d="M490 1405 H160" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>